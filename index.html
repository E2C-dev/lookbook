<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- PWA（ホーム画面追加）用の設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Lookbook App</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (ブラウザ上でReactコードを変換) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans selection:bg-gray-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- アイコン群 (Lucide IconsのSVG) ---
        const IconCamera = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>;
        const IconPlus = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>;
        const IconLayoutGrid = ({size=24, className="", strokeWidth=2}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>;
        const IconLayers = ({size=24, className="", strokeWidth=2}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
        const IconSettings = ({size=24, className="", strokeWidth=2}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
        const IconTrash2 = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;
        const IconX = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>;
        const IconCheck = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>;
        const IconImage = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>;
        const IconShirt = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20.38 3.46L16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>;
        const IconDownload = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const IconUpload = ({size=24, className=""}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>;

        const CATEGORIES = ['トップス', 'ボトムス', 'ワンピース', 'アウター', 'シューズ', 'アクセサリー'];

        // --- データベース管理 ---
        const DB_NAME = 'LookbookLocalDB';
        const DB_VERSION = 1;

        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => resolve(e.target.result);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('items')) db.createObjectStore('items', { keyPath: 'id' });
                    if (!db.objectStoreNames.contains('outfits')) db.createObjectStore('outfits', { keyPath: 'id' });
                };
            });
        };

        const dbGetAll = async (storeName) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readonly');
                const store = tx.objectStore(storeName);
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const dbPut = async (storeName, data) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.put(data); // addではなくputで上書きも対応
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        };

        const dbDelete = async (storeName, id) => {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, 'readwrite');
                const store = tx.objectStore(storeName);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        };

        // --- 画像圧縮 ---
        const compressImage = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 600;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.8));
                    };
                };
                reader.onerror = (error) => reject(error);
            });
        };

        // --- メインアプリ ---
        function LookbookApp() {
            const [items, setItems] = useState([]);
            const [outfits, setOutfits] = useState([]);
            const [activeTab, setActiveTab] = useState('closet'); 
            const [loading, setLoading] = useState(true);
            
            const [selectedCategory, setSelectedCategory] = useState('すべて');

            const [newItemFile, setNewItemFile] = useState(null);
            const [newItemPreview, setNewItemPreview] = useState(null);
            const [newItemCategory, setNewItemCategory] = useState('トップス');
            const [newItemName, setNewItemName] = useState('');
            const [isSaving, setIsSaving] = useState(false);
            const fileInputRef = useRef(null);
            const importInputRef = useRef(null);

            const [outfitName, setOutfitName] = useState('');
            const [selectedOutfitItems, setSelectedOutfitItems] = useState([]);

            const loadData = async () => {
                try {
                    setLoading(true);
                    const fetchedItems = await dbGetAll('items');
                    const fetchedOutfits = await dbGetAll('outfits');
                    fetchedItems.sort((a, b) => b.createdAt - a.createdAt);
                    fetchedOutfits.sort((a, b) => b.createdAt - a.createdAt);
                    setItems(fetchedItems);
                    setOutfits(fetchedOutfits);
                } catch (error) {
                    console.error("データ読み込みエラー:", error);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { loadData(); }, []);

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                setNewItemFile(file);
                setNewItemPreview(URL.createObjectURL(file));
            };

            const handleSaveItem = async () => {
                if (!newItemFile) return;
                setIsSaving(true);
                try {
                    const base64Image = await compressImage(newItemFile);
                    const newItem = {
                        id: Date.now().toString() + Math.random().toString(36).substring(2),
                        name: newItemName || '名称未設定',
                        category: newItemCategory,
                        image: base64Image,
                        createdAt: Date.now()
                    };
                    await dbPut('items', newItem);
                    await loadData();
                    setNewItemFile(null); setNewItemPreview(null); setNewItemName('');
                    setActiveTab('closet');
                } catch (error) {
                    alert("保存に失敗しました");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDeleteItem = async (id) => {
                if(confirm("このアイテムを削除しますか？")) {
                    await dbDelete('items', id);
                    setSelectedOutfitItems(prev => prev.filter(item => item.id !== id));
                    await loadData();
                }
            };

            const toggleOutfitItem = (item) => {
                if (selectedOutfitItems.find(i => i.id === item.id)) {
                    setSelectedOutfitItems(prev => prev.filter(i => i.id !== item.id));
                } else {
                    setSelectedOutfitItems(prev => [...prev, item]);
                }
            };

            const handleSaveOutfit = async () => {
                if (selectedOutfitItems.length === 0) return;
                setIsSaving(true);
                try {
                    const newOutfit = {
                        id: Date.now().toString() + Math.random().toString(36).substring(2),
                        name: outfitName || '新しいコーデ',
                        itemIds: selectedOutfitItems.map(item => item.id),
                        createdAt: Date.now()
                    };
                    await dbPut('outfits', newOutfit);
                    await loadData();
                    setOutfitName(''); setSelectedOutfitItems([]);
                    setActiveTab('outfits');
                } catch (error) {
                    alert("保存に失敗しました");
                } finally {
                    setIsSaving(false);
                }
            };

            const handleDeleteOutfit = async (id) => {
                if(confirm("このコーデを削除しますか？")) {
                    await dbDelete('outfits', id);
                    await loadData();
                }
            };

            // --- バックアップと復元 ---
            const handleExportData = async () => {
                try {
                    const exportData = { items, outfits };
                    const blob = new Blob([JSON.stringify(exportData)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `lookbook_backup_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } catch(e) {
                    alert('バックアップに失敗しました。');
                }
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if(!confirm("現在のデータに上書き・追加されます。よろしいですか？")) return;
                
                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        setLoading(true);
                        if (data.items) {
                            for (const item of data.items) await dbPut('items', item);
                        }
                        if (data.outfits) {
                            for (const outfit of data.outfits) await dbPut('outfits', outfit);
                        }
                        await loadData();
                        alert('データを復元しました！');
                        e.target.value = ''; // reset
                    } catch (err) {
                        alert('データファイルの読み込みに失敗しました。');
                        setLoading(false);
                    }
                };
                reader.readAsText(file);
            };

            if (loading && items.length === 0) {
                return <div className="min-h-screen flex items-center justify-center"><div className="animate-spin rounded-full h-10 w-10 border-b-2 border-black"></div></div>;
            }

            return (
                <div className="min-h-screen max-w-md mx-auto shadow-xl bg-white pb-24 relative overflow-hidden flex flex-col">
                    {/* Header */}
                    <header className="sticky top-0 z-10 bg-white/90 backdrop-blur-md border-b border-gray-100 px-6 py-4 pt-safe flex justify-between items-center">
                        <h1 className="text-xl font-bold tracking-widest uppercase">Lookbook</h1>
                        {activeTab === 'closet' && (
                            <button onClick={() => setActiveTab('add')} className="p-2 bg-black text-white rounded-full hover:bg-gray-800 transition">
                                <IconPlus size={20} />
                            </button>
                        )}
                    </header>

                    {/* Content */}
                    <main className="p-4 flex-grow overflow-y-auto">
                        
                        {/* タブ1: クローゼット */}
                        {activeTab === 'closet' && (
                            <div className="animate-fade-in">
                                <div className="flex overflow-x-auto pb-4 mb-2 space-x-2 scrollbar-hide">
                                    {['すべて', ...CATEGORIES].map(cat => (
                                        <button key={cat} onClick={() => setSelectedCategory(cat)}
                                            className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-black text-white' : 'bg-gray-100 text-gray-600'}`}>
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                {items.length === 0 ? (
                                    <div className="text-center py-20 text-gray-400 flex flex-col items-center">
                                        <IconShirt size={48} className="mb-4 opacity-50" />
                                        <p>アイテムがありません。</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-2 gap-3">
                                        {items.filter(item => selectedCategory === 'すべて' || item.category === selectedCategory).map(item => (
                                            <div key={item.id} className="relative group bg-gray-100 rounded-xl overflow-hidden aspect-[3/4]">
                                                <img src={item.image} alt={item.name} className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition flex flex-col justify-end p-2">
                                                    <p className="text-white text-xs truncate">{item.name}</p>
                                                    <button onClick={() => handleDeleteItem(item.id)} className="absolute top-2 right-2 p-1.5 bg-white/20 backdrop-blur-md rounded-full text-white">
                                                        <IconTrash2 size={14} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* タブ2: アイテム追加 */}
                        {activeTab === 'add' && (
                            <div className="animate-fade-in max-w-sm mx-auto">
                                <h2 className="text-lg font-bold mb-4 flex items-center"><IconPlus size={20} className="mr-2"/> 服を追加</h2>
                                <div className="mb-6">
                                    {newItemPreview ? (
                                        <div className="relative aspect-[3/4] rounded-2xl overflow-hidden border border-gray-200">
                                            <img src={newItemPreview} className="w-full h-full object-cover" />
                                            <button onClick={() => { setNewItemFile(null); setNewItemPreview(null); }} className="absolute top-4 right-4 p-2 bg-black/50 text-white rounded-full">
                                                <IconX size={20} />
                                            </button>
                                        </div>
                                    ) : (
                                        <div onClick={() => fileInputRef.current?.click()} className="aspect-[3/4] rounded-2xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center text-gray-500 cursor-pointer">
                                            <IconCamera size={40} className="mb-3 opacity-50" />
                                            <p className="text-sm font-medium">写真を撮る or 選ぶ</p>
                                            <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleFileChange} />
                                        </div>
                                    )}
                                </div>
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">カテゴリー</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {CATEGORIES.map(cat => (
                                                <button key={cat} onClick={() => setNewItemCategory(cat)} className={`py-2 text-xs font-medium rounded-lg border ${newItemCategory === cat ? 'border-black bg-black text-white' : 'border-gray-200 bg-white text-gray-600'}`}>{cat}</button>
                                            ))}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-500 mb-1">アイテム名 (任意)</label>
                                        <input type="text" value={newItemName} onChange={(e) => setNewItemName(e.target.value)} placeholder="例: 白いTシャツ" className="w-full px-4 py-3 rounded-xl border border-gray-200" />
                                    </div>
                                    <button onClick={handleSaveItem} disabled={!newItemFile || isSaving} className={`w-full py-3.5 rounded-xl font-bold text-sm ${!newItemFile || isSaving ? 'bg-gray-200 text-gray-400' : 'bg-black text-white'}`}>
                                        {isSaving ? '保存中...' : '追加する'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* タブ3: コーデ作成 */}
                        {activeTab === 'create-outfit' && (
                            <div className="animate-fade-in flex flex-col h-full">
                                <h2 className="text-lg font-bold mb-4 flex items-center"><IconLayers size={20} className="mr-2"/> コーデを作成</h2>
                                <div className="bg-gray-100 rounded-2xl p-4 mb-4 min-h-[180px] flex flex-col">
                                    <div className="flex-grow flex items-center justify-center">
                                        {selectedOutfitItems.length === 0 ? (
                                            <p className="text-gray-400 text-sm">下からアイテムを選択</p>
                                        ) : (
                                            <div className="flex flex-wrap gap-2 justify-center">
                                                {selectedOutfitItems.map(item => (
                                                    <div key={`sel-${item.id}`} className="relative w-20 h-20 rounded-lg overflow-hidden border border-white shadow-sm">
                                                        <img src={item.image} className="w-full h-full object-cover" />
                                                        <button onClick={() => toggleOutfitItem(item)} className="absolute -top-1 -right-1 bg-black text-white rounded-full p-0.5 scale-75"><IconX size={16} /></button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-4 flex gap-2">
                                        <input type="text" value={outfitName} onChange={(e) => setOutfitName(e.target.value)} placeholder="コーデの名前 (任意)" className="flex-grow px-3 py-2 text-sm rounded-lg border border-gray-200" />
                                        <button onClick={handleSaveOutfit} disabled={selectedOutfitItems.length === 0 || isSaving} className={`px-4 py-2 rounded-lg text-sm font-bold ${selectedOutfitItems.length === 0 || isSaving ? 'bg-gray-200 text-gray-400' : 'bg-black text-white'}`}>保存</button>
                                    </div>
                                </div>
                                <div className="flex-grow">
                                    <div className="grid grid-cols-3 gap-2 pb-6">
                                        {items.map(item => {
                                            const isSelected = selectedOutfitItems.some(i => i.id === item.id);
                                            return (
                                                <div key={`pick-${item.id}`} onClick={() => toggleOutfitItem(item)} className={`relative aspect-square rounded-xl overflow-hidden cursor-pointer border-2 ${isSelected ? 'border-black' : 'border-transparent'}`}>
                                                    <img src={item.image} className={`w-full h-full object-cover ${isSelected ? 'opacity-70' : ''}`} />
                                                    {isSelected && <div className="absolute inset-0 flex items-center justify-center"><div className="bg-black text-white rounded-full p-1"><IconCheck size={20} /></div></div>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* タブ4: コーデ一覧 */}
                        {activeTab === 'outfits' && (
                            <div className="animate-fade-in">
                                <h2 className="text-lg font-bold mb-4 flex items-center"><IconImage size={20} className="mr-2"/> 保存したコーデ</h2>
                                {outfits.length === 0 ? (
                                    <div className="text-center py-20 text-gray-400 flex flex-col items-center">
                                        <IconLayers size={48} className="mb-4 opacity-50" />
                                        <p>コーデがありません。</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-4">
                                        {outfits.map(outfit => {
                                            const outfitItems = outfit.itemIds.map(id => items.find(i => i.id === id)).filter(Boolean);
                                            return (
                                                <div key={outfit.id} className="bg-white rounded-2xl border border-gray-100 shadow-sm p-4 relative group">
                                                    <div className="flex justify-between items-start mb-3">
                                                        <h3 className="font-bold">{outfit.name}</h3>
                                                        <button onClick={() => handleDeleteOutfit(outfit.id)} className="text-gray-400 hover:text-red-500"><IconTrash2 size={16} /></button>
                                                    </div>
                                                    <div className="flex flex-wrap gap-2">
                                                        {outfitItems.map((item, idx) => (
                                                            <div key={`${outfit.id}-${idx}`} className="w-16 h-16 rounded-lg overflow-hidden border border-gray-100">
                                                                <img src={item.image} className="w-full h-full object-cover" />
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                )}
                            </div>
                        )}

                        {/* タブ5: 設定（バックアップ等） */}
                        {activeTab === 'settings' && (
                            <div className="animate-fade-in space-y-6">
                                <h2 className="text-lg font-bold mb-4 flex items-center"><IconSettings size={20} className="mr-2"/> 設定</h2>
                                
                                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                                    <h3 className="text-sm font-bold text-gray-900 mb-2">データのバックアップ（保存）</h3>
                                    <p className="text-xs text-gray-500 mb-4">現在の服やコーデのデータをファイルとしてダウンロードします。機種変更時や万が一に備えて定期的に行ってください。</p>
                                    <button onClick={handleExportData} className="w-full flex justify-center items-center py-3 bg-gray-900 text-white rounded-xl text-sm font-bold hover:bg-black transition">
                                        <IconDownload size={18} className="mr-2" />
                                        バックアップファイルを保存
                                    </button>
                                </div>

                                <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm">
                                    <h3 className="text-sm font-bold text-gray-900 mb-2">データの復元（読み込み）</h3>
                                    <p className="text-xs text-gray-500 mb-4">保存したバックアップファイルを読み込んでデータを復元します。</p>
                                    <button onClick={() => importInputRef.current?.click()} className="w-full flex justify-center items-center py-3 bg-white text-gray-900 border border-gray-300 rounded-xl text-sm font-bold hover:bg-gray-50 transition">
                                        <IconUpload size={18} className="mr-2" />
                                        ファイルを選択して復元
                                    </button>
                                    <input type="file" accept=".json" className="hidden" ref={importInputRef} onChange={handleImportData} />
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Navigation */}
                    <nav className="absolute bottom-0 w-full max-w-md left-1/2 transform -translate-x-1/2 bg-white/95 backdrop-blur-lg border-t border-gray-200 flex justify-around items-center pb-safe pt-2 px-1 z-50">
                        <button onClick={() => setActiveTab('closet')} className={`flex flex-col items-center p-2 min-w-[60px] ${activeTab === 'closet' || activeTab === 'add' ? 'text-black' : 'text-gray-400'}`}>
                            <IconLayoutGrid size={22} strokeWidth={activeTab === 'closet' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold mt-1">服一覧</span>
                        </button>
                        <button onClick={() => setActiveTab('create-outfit')} className={`flex flex-col items-center p-2 min-w-[60px] ${activeTab === 'create-outfit' ? 'text-black' : 'text-gray-400'}`}>
                            <IconPlus size={22} strokeWidth={activeTab === 'create-outfit' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold mt-1">コーデ作成</span>
                        </button>
                        <button onClick={() => setActiveTab('outfits')} className={`flex flex-col items-center p-2 min-w-[60px] ${activeTab === 'outfits' ? 'text-black' : 'text-gray-400'}`}>
                            <IconLayers size={22} strokeWidth={activeTab === 'outfits' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold mt-1">コーデ一覧</span>
                        </button>
                        <button onClick={() => setActiveTab('settings')} className={`flex flex-col items-center p-2 min-w-[60px] ${activeTab === 'settings' ? 'text-black' : 'text-gray-400'}`}>
                            <IconSettings size={22} strokeWidth={activeTab === 'settings' ? 2.5 : 2} />
                            <span className="text-[9px] font-bold mt-1">設定</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LookbookApp />);
    </script>
</body>
</html>
